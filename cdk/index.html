<!doctype html>
<!-- Página puente de la app de entrenadores del CDK (19-11-2026).
     Solo lleva el escudo y el enlace a la app de Apps Script: ningún dato del club ni de alumnos.
     Fuente: PROYECTOS CLAUDE/CLUB DEPORTIVO KOLBE/APP_ENTRENADORES/puente/ · Publicada en davidkolbe.github.io/kolbe-pizarra/cdk/ -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CDK</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CDK">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#007937">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="icon" type="image/png" href="icono-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
       background:#0f3d24;color:#fff;font-family:-apple-system,system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
  img{width:120px;height:120px;margin-bottom:20px}
  h1{font-size:22px;margin:0 0 12px}
  p{font-size:16px;line-height:1.45;max-width:340px;margin:0 0 14px}
  a.boton{display:inline-block;margin-top:8px;padding:12px 22px;border-radius:10px;background:#fff;color:#0f3d24;
          font-weight:600;text-decoration:none}
  #instalar{display:none}
</style>
</head>
<body>
<img src="icono-180.png" alt="Escudo del Club Deportivo Kolbe">
<h1>Entrenadores CDK</h1>
<div id="abriendo"><p>Abriendo la app…</p></div>
<div id="instalar">
  <p>Para tenerla como una app más: toca <b>Compartir</b> (el cuadrado con la flecha hacia arriba) y después
     <b>«Añadir a pantalla de inicio»</b>. Luego ábrela siempre desde ese icono.</p>
</div>
<a class="boton" id="enlace" href="#">Abrir la app</a>
<script>
  var APP = "https://script.google.com/a/macros/colegiokolbe.com/s/AKfycbwiIzxktvw_w9G7gCSmID4cf9-IFTPbCSLfHkCWjs7lUkfQGjM5cAkSrRQfaf-SpqJJ/exec";
  document.getElementById("enlace").href = APP;
  var desdeIcono = window.navigator.standalone === true ||
                   (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
  if (desdeIcono) {
    location.replace(APP);            // abierta desde el icono: salta directa a la app
  } else {
    document.getElementById("abriendo").style.display = "none";
    document.getElementById("instalar").style.display = "block";   // en el navegador: explica cómo añadirla
  }
</script>
</body>
</html>
