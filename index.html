<style>
:root{--bg:#0f3d24;--panel:#ffffff;--ink:#16241b;--accent:#007937;--mal:#b3261e}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
form{background:var(--panel);color:var(--ink);border-radius:18px;padding:28px 24px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px;align-items:stretch;text-align:center}
img{width:96px;height:96px;align-self:center}
h1{margin:0;font-size:1.35rem;color:var(--accent)}
p{margin:0;color:#4d5c53;font-size:.92rem}
input[type=password]{font:inherit;font-size:1.1rem;padding:14px;border:1px solid #c9d6cd;border-radius:12px}
label{display:flex;gap:8px;align-items:center;justify-content:center;font-size:.92rem}
input[type=checkbox]{width:20px;height:20px}
button{font:inherit;font-weight:700;font-size:1.05rem;padding:14px;border:0;border-radius:12px;background:var(--accent);color:#fff;min-height:48px}
button:disabled{opacity:.6}
.mal{color:var(--mal);font-weight:700;min-height:1.2em}
</style></head><body>

  <label><input id="r" type="checkbox" checked> Recordar en esta tablet</label>

</form>

if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
async function abre(llave){
  const t=await crypto.subtle.decrypt({name:"AES-GCM",iv:de64(NONCE)},llave,de64(DATOS));
  const html=new TextDecoder().decode(t);document.open();document.write(html);document.close();
}
async function llaveDe(pass){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:de64(SAL),iterations:VUELTAS,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
}
(async()=>{try{const g=JSON.parse(localStorage.getItem(CLAVE_LS)||"null");
  if(g&&g.s===SAL){const k=await crypto.subtle.importKey("raw",de64(g.k),"AES-GCM",false,["decrypt"]);await abre(k);return}}
  catch(e){try{localStorage.removeItem(CLAVE_LS)}catch(_){}}
  document.getElementById("c").focus();})();
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();const b=document.getElementById("b"),m=document.getElementById("m");b.disabled=true;b.textContent="Abriendo…";m.textContent="";
  try{const k=await llaveDe(document.getElementById("c").value);
    const bruta=await crypto.subtle.exportKey("raw",k);
    await crypto.subtle.decrypt({name:"AES-GCM",iv:de64(NONCE)},k,de64(DATOS));
    if(document.getElementById("r").checked){try{localStorage.setItem(CLAVE_LS,JSON.stringify({s:SAL,k:a64(bruta)}))}catch(_){}}
    await abre(k);
  }catch(err){m.textContent="Contraseña incorrecta.";b.disabled=false;b.textContent="Entrar"}
});
